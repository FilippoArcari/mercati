  fred_api_key: ${oc.env:FRED_API_KEY}
  split_train: 0.7
  split_validation: 0.1
  split_test: 0.2
training:
  epochs: 1000
  learning_rate: 0.001
  batch_size: 32
  optimizer: adam
  weight_decay: 1.0e-05
  scheduler:
    enabled: false
    type: cosine
    warmup_steps: 100
  early_stopping:
    enabled: true
    patience: 50
    min_delta: 1.0e-05
  mre:
    enabled: true
    update_mode: simultaneous
    lambda_entropy: 0.05
    lambda_moment: 0.1
    epochs_phase1: 30
prediction:
  name: prediction_config
  optimizer: adam
  learning_rate: 0.001
  epochs: 500
  batch_size: 128
  weight_decay: 0.0001
  hidden_size: 128
  num_heads: 4
  num_layers: 2
  forecast_horizon: 3
  sliding_window: 500
  stride: 5
  kernel_size: 3
  dilation: 3
  patience: 3
  min_delta: 0.001
  dropout: 0.1
  mc_iteration: 1
trader:
  total_timesteps: 50
  log_every: 25
paths:
  output_dir: ${hydra:runtime.output_dir}
  results_dir: ./results
  checkpoint_dir: ./checkpoints
step: train
frequency: 2m
optuna:
  n_trials: 50
  max_epochs: 30
  batch_size: 64
  pruner: hyperband
  storage: sqlite:///hpo.db
